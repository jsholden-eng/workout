async function doImport() {
  var btn = document.getElementById('btn');
  var status = document.getElementById('status');
  var rowsEl = document.getElementById('rows');
  btn.disabled = true;
  status.className = 'status';
  status.textContent = 'Sending to Google Sheets...';

  try {
    // Send in one POST-style GET with full base64 data
    var url = SCRIPT_URL + '?action=push&token=' + encodeURIComponent(TOKEN) + '&data=' + encodeURIComponent(DATA);
    var r = await fetch(url, {method:'GET', mode:'cors'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    var j = await r.json();
    if (j.status !== 'ok') throw new Error(j.msg || 'Failed');
    status.className = 'status ok';
    status.textContent = '✓ Successfully imported ' + j.rows + ' rows into Google Sheets!';
    rowsEl.textContent = 'Check your spreadsheet — the Log tab should now show all your Week 1 data in rows.';
    btn.textContent = 'Done ✓';
  } catch(e) {
    status.className = 'status err';
    status.textContent = 'Failed: ' + e.message;
    btn.disabled = false;
  }
}
</script>
